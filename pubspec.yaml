name: erp_dulceria
description: ERP para dulcería — Flutter + Supabase
publish_to: 'none'
version: 1.0.0+1
environment:
  sdk: '>=3.12.0 <4.0.0'
dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  # Backend
  supabase_flutter: ^2.8.0
  # Persistencia local ligera (recordar sesión/preferencias, ej. modo oscuro)
  shared_preferences: ^2.2.2
  # UI
  google_fonts: ^6.2.1
  fl_chart: ^0.67.0
  # Formato de fecha/moneda en español (es_MX)
  intl: ^0.19.0
  # Generación y compartición de PDF (reporte)
  pdf: ^3.10.7
  printing: ^5.12.0
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
flutter:
  uses-material-design: true
